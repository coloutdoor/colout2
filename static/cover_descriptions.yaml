- type: pergola
  posts: Premium pressure treated lumber with new concrete footings.
  headers: Douglas fir beams.
  framing: Douglas fir roof rafters at 24" on center.
  roof-deck: N/A
  roof: Choice of Sun-tuf polycabonate roofing or 2x2 purlins at 24" o.c.
